    languageCode = 'en'
    languageName = 'English'
    weight = 1
    title = 'Tow — Lightweight Deployment Orchestrator | by neurosam.AI (뉴로샘AI)'
    [languages.en.params]
      description = 'Tow is a lightweight, agentless deployment orchestrator for bare-metal servers and cloud VMs — built and maintained by neurosam.AI (legal: Neurosam AI Inc. / Korean: 주식회사 뉴로샘에이아이 / short: 뉴로샘AI). Open source under MIT.'
      keywords = 'Tow,tow-cli,neurosam.AI,neurosam.ai,Neurosam AI,Neurosam AI Inc.,deployment,DevOps,CLI,SSH,agentless,orchestrator,bare-metal,VM,Go,open source,MIT'
      tagline = 'Deploy without the complexity'
    [languages.en.params.nav]
